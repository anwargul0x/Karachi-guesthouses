<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guesthouse Details - Karachi Guesthouse Hub</title>
    <style>
        /* Base styles */
        :root {
            --primary-color: #2563eb;
            --secondary-color: #60a5fa;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --light-bg: #f1f5f9;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--light-bg);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        /* Header Styles */
        header {
            background-color: white;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        .logo span {
            color: var(--secondary-color);
        }
        
        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }
        
        nav a {
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
            transition: color 0.2s;
        }
        
        nav a:hover {
            color: var(--primary-color);
        }

        /* Back button */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            margin: 1rem 0;
            transition: background 0.2s;
        }

        .back-button:hover {
            background: #1d4ed8;
            color: white;
            text-decoration: none;
        }

        /* Guesthouse detail styles */
        .guesthouse-detail {
            background: white;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin: 2rem 0;
        }

        .guesthouse-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .guesthouse-title h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .guesthouse-location {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .price-rating {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .guesthouse-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .price-per-night {
            font-size: 1rem;
            font-weight: normal;
            color: var(--text-secondary);
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
        }

        /* Image gallery */
        .image-gallery {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .main-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        .image-thumbnails {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.5rem 0;
        }

        .thumbnail {
            width: 100px;
            height: 75px;
            object-fit: cover;
            border-radius: 0.25rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .thumbnail:hover,
        .thumbnail.active {
            opacity: 1;
        }

        /* Content sections */
        .content-section {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .content-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .amenities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .amenity-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--light-bg);
            border-radius: 0.375rem;
        }

        .amenity-icon {
            font-size: 1.25rem;
        }

        /* Contact section */
        .contact-section {
            text-align: center;
            padding: 2rem;
            background: var(--light-bg);
        }

        .whatsapp-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 1.1rem;
            transition: background 0.2s;
            margin-top: 1rem;
        }

        .whatsapp-button:hover {
            background: #128c7e;
            color: white;
            text-decoration: none;
        }

        /* Footer */
        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 0;
            margin-top: 2rem;
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .footer-logo {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .footer-links a {
            color: white;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .footer-links a:hover {
            opacity: 1;
        }

        .copyright {
            opacity: 0.8;
            text-align: center;
            font-size: 0.875rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
            
            nav ul {
                gap: 1rem;
            }

            .guesthouse-header {
                padding: 1.5rem;
            }

            .guesthouse-title h1 {
                font-size: 1.5rem;
            }

            .price-rating {
                flex-direction: column;
                align-items: flex-start;
            }

            .main-image {
                height: 250px;
            }

            .content-section {
                padding: 1.5rem;
            }

            .amenities-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="css/enhancements.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">Karachi<span>Guesthouse</span></div>
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="guesthouses.html">Guesthouses</a></li>
                        <li><a href="neighborhoods.html">Neighborhoods</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <a href="javascript:history.back()" class="back-button">
            ← Back to Listings
        </a>

        <div class="guesthouse-detail" id="guesthouseDetail">
            <!-- Content will be loaded by JavaScript -->
            <div style="padding: 2rem; text-align: center;">
                <p>Loading guesthouse details...</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">Karachi Guesthouse Hub</div>
                <div class="footer-links">
                    <a href="index.html">Home</a>
                    <a href="guesthouses.html">Guesthouses</a>
                    <a href="neighborhoods.html">Neighborhoods</a>
                    <a href="contact.html">Contact</a>
                    <a href="privacy.html">Privacy Policy</a>
                    <a href="terms.html">Terms of Service</a>
                </div>
                <div class="copyright">&copy; 2023 Karachi Guesthouse Hub. All rights reserved.</div>
            </div>
        </div>
    </footer>

    <script>
        // Load guesthouse details from localStorage
        document.addEventListener('DOMContentLoaded', function() {
            const selectedGuesthouse = localStorage.getItem('selectedGuesthouse');
            
            if (selectedGuesthouse) {
                const guesthouse = JSON.parse(selectedGuesthouse);
                displayGuesthouseDetails(guesthouse);
            } else {
                // Fallback: try to get ID from URL
                const urlParams = new URLSearchParams(window.location.search);
                const id = urlParams.get('id');
                
                if (id) {
                    // You could fetch guesthouse data here or redirect back
                    document.getElementById('guesthouseDetail').innerHTML = `
                        <div style="padding: 2rem; text-align: center;">
                            <h2>Guesthouse not found</h2>
                            <p>Please go back and select a guesthouse from the listings.</p>
                            <a href="index.html" class="back-button" style="margin-top: 1rem;">Go to Home</a>
                        </div>
                    `;
                } else {
                    window.location.href = 'index.html';
                }
            }
        });

        function displayGuesthouseDetails(guesthouse) {
            const detailContainer = document.getElementById('guesthouseDetail');
            
            detailContainer.innerHTML = `
                <div class="guesthouse-header">
                    <div class="guesthouse-title">
                        <h1>${guesthouse.name}</h1>
                        <div class="guesthouse-location">
                            <span>📍</span> ${guesthouse.address}
                        </div>
                    </div>
                    <div class="price-rating">
                        <div class="guesthouse-price">
                            ₨ ${guesthouse.price.toLocaleString()}<span class="price-per-night">/night</span>
                        </div>
                        <div class="rating">
                            <span>⭐</span>
                            <span>${guesthouse.rating}/5</span>
                        </div>
                    </div>
                </div>

                <div class="image-gallery">
                    <img src="${guesthouse.images[0]}" alt="${guesthouse.name}" class="main-image" id="mainImage">
                    ${guesthouse.images.length > 1 ? `
                        <div class="image-thumbnails">
                            ${guesthouse.images.map((img, index) => `
                                <img src="${img}" alt="Image ${index + 1}" class="thumbnail ${index === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)">
                            `).join('')}
                        </div>
                    ` : ''}
                </div>

                <div class="content-section">
                    <h2 class="section-title">About This Guesthouse</h2>
                    <p>${guesthouse.description}</p>
                </div>

                <div class="content-section">
                    <h2 class="section-title">Amenities</h2>
                    <div class="amenities-grid">
                        ${guesthouse.amenities.map(amenity => `
                            <div class="amenity-item">
                                <span class="amenity-icon">${getAmenityIcon(amenity)}</span>
                                <span>${amenity}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="contact-section">
                    <h2 class="section-title">Contact Guesthouse</h2>
                    <p>For bookings and inquiries, contact us directly via WhatsApp</p>
                    <a href="https://wa.me/${guesthouse.phone.replace(/[^0-9]/g, '')}?text=Hi! I'm interested in booking ${encodeURIComponent(guesthouse.name)} in ${encodeURIComponent(guesthouse.neighborhood)}. Can you check availability and provide booking details?" 
                       class="whatsapp-button">
                        <span>📱</span> WhatsApp Now
                    </a>
                </div>
            `;
        }

        function changeMainImage(src, thumbnail) {
            document.getElementById('mainImage').src = src;
            
            // Update active thumbnail
            document.querySelectorAll('.thumbnail').forEach(thumb => thumb.classList.remove('active'));
            thumbnail.classList.add('active');
        }

        function getAmenityIcon(amenity) {
            const icons = {
                'AC': '❄️',
                'WiFi': '📶',
                'Breakfast': '🍳',
                'Parking': '🚗',
                'Garden': '🌳',
                'Laundry': '👕',
                'Kitchen': '🍽️',
                'Family Friendly': '👨‍👩‍👧‍👦'
            };
            return icons[amenity] || '✅';
        }
    </script>

    <!-- Include main JavaScript application -->
    <script src="js/app.js"></script>
</body>
</html>
